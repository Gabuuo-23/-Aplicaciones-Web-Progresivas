<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevConnect - Red Social</title>

    <meta name="description" content="DevConnect, la red social de nuestra comunidad de desarrollo web.">
    <meta name="theme-color" content="#2563eb">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- CSS propio -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Manifest PWA -->
    <link rel="manifest" href="./manifest.json">

    <!-- Icono para iOS -->
    <link rel="apple-touch-icon" href="./images/icon-192x192.png">

</head>

<body class="bg-gray-100 min-h-screen flex flex-col font-sans">

    <!-- ==========================================
         HEADER / BARRA SUPERIOR
    =========================================== -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">

        <h1 class="text-xl font-bold">
            <i class="fa-solid fa-code"></i>
            DevConnect
        </h1>

        <button
            id="btn-sync"
            type="button"
            class="hover:text-blue-200 transition"
            aria-label="Sincronizar contenido"
            title="Sincronizar"
        >
            <i class="fa-solid fa-rotate"></i>
        </button>

    </header>


    <!-- ==========================================
         CONTENIDO PRINCIPAL / FEED
    =========================================== -->
    <main
        class="flex-1 overflow-y-auto p-4 pb-24"
        id="feed"
    >

        <!-- Publicación de ejemplo -->
        <article class="bg-white p-4 rounded-lg shadow mb-4">

            <!-- Información del usuario -->
            <div class="flex items-center mb-3">

                <div class="w-10 h-10 rounded-full bg-blue-300 flex items-center justify-center text-white font-bold mr-3">
                    P
                </div>

                <div>
                    <h2 class="font-bold text-gray-800">
                        Profesor Web
                    </h2>

                    <p class="text-xs text-gray-500">
                        Hace 2 minutos
                    </p>
                </div>

            </div>

            <!-- Texto de la publicación -->
            <p class="text-gray-700">
                ¡Bienvenidos a nuestra red social de la clase!
                Pronto esta app funcionará 100% sin conexión. 🚀
            </p>

        </article>

    </main>


    <!-- ==========================================
         BOTÓN FLOTANTE / NUEVA PUBLICACIÓN
    =========================================== -->
    <button
        id="btn-new-post"
        type="button"
        class="fixed bottom-20 right-4 bg-blue-600 text-white w-14 h-14 rounded-full shadow-lg text-2xl flex items-center justify-center hover:bg-blue-700 transition z-20"
        aria-label="Crear nueva publicación"
        title="Nueva publicación"
    >
        <i class="fa-solid fa-pen"></i>
    </button>


    <!-- ==========================================
         BARRA DE NAVEGACIÓN INFERIOR
    =========================================== -->
    <nav
        class="bg-white border-t border-gray-200 fixed bottom-0 left-0 w-full flex justify-around p-3 text-gray-500 z-10"
        aria-label="Navegación principal"
    >

        <!-- Inicio -->
        <a
            href="#inicio"
            class="flex flex-col items-center text-blue-600"
            aria-current="page"
        >
            <i class="fa-solid fa-house text-xl mb-1"></i>

            <span class="text-[10px]">
                Inicio
            </span>
        </a>


        <!-- Buscar -->
        <a
            href="#buscar"
            class="flex flex-col items-center hover:text-blue-600 transition"
        >
            <i class="fa-solid fa-magnifying-glass text-xl mb-1"></i>

            <span class="text-[10px]">
                Buscar
            </span>
        </a>


        <!-- Avisos -->
        <a
            href="#avisos"
            class="flex flex-col items-center hover:text-blue-600 transition"
        >
            <i class="fa-regular fa-bell text-xl mb-1"></i>

            <span class="text-[10px]">
                Avisos
            </span>
        </a>


        <!-- Perfil -->
        <a
            href="#perfil"
            class="flex flex-col items-center hover:text-blue-600 transition"
        >
            <i class="fa-regular fa-user text-xl mb-1"></i>

            <span class="text-[10px]">
                Perfil
            </span>
        </a>

    </nav>


    <!-- ==========================================
         JAVASCRIPT PRINCIPAL
         Ubicación: src/js/app.js
    =========================================== -->
    <script src="./src/js/app.js" defer></script>


    <!-- ==========================================
         REGISTRO DEL SERVICE WORKER
         Ubicación: sw.js
    =========================================== -->
    <script>
        if ('serviceWorker' in navigator) {

            window.addEventListener('load', async () => {

                try {

                    const registration =
                        await navigator.serviceWorker.register('./sw.js');

                    console.log(
                        'Service Worker registrado correctamente:',
                        registration.scope
                    );

                } catch (error) {

                    console.error(
                        'Error registrando el Service Worker:',
                        error
                    );

                }

            });

        }
    </script>

</body>
</html>
